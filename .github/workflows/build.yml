name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

# Runs on the same ref queue up instead of racing to publish the same release.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: HIM-jar
          path: build/libs/*.jar

      - name: Publish release
        # A release is created once per version: on main whenever build.gradle.kts carries a version
        # that has no release yet, or when a v* tag is pushed. Notes come from docs/releases/<tag>.md.
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' build.gradle.kts)
          tag="v$version"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then tag="$GITHUB_REF_NAME"; fi
          if gh release view "$tag" >/dev/null 2>&1; then
            if [[ "$GITHUB_REF" == refs/tags/* ]]; then
              gh release upload "$tag" build/libs/*.jar --clobber
            else
              echo "Release $tag already exists; nothing to publish."
            fi
            exit 0
          fi
          notes="docs/releases/$tag.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" build/libs/*.jar --target "$GITHUB_SHA" --title "HIM $tag" --notes-file "$notes"
          else
            gh release create "$tag" build/libs/*.jar --target "$GITHUB_SHA" --title "HIM $tag" --generate-notes
          fi
