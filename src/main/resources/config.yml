# ============================================================================
#  HIM — He Is Memory （PROJECT HIM）
#  Paper 26.3 心理恐怖插件設定檔
#
#  修改後執行 /him reload 即可套用；若設定有錯誤，插件會列出所有錯誤並保留
#  先前的有效設定，不會無聲失敗。
# ============================================================================

# 設定檔版本，請勿手動修改。
config-version: 1

# 總開關。false 時 HIM 完全沉睡（指令仍可使用）。
enabled: true

logging:
  # off / info / debug / trace
  # debug 會在主控台記錄導演的決策；trace 會記錄大量內部細節，只建議除錯時使用。
  level: info

# ----------------------------------------------------------------------------
# 世界
# ----------------------------------------------------------------------------
worlds:
  # blacklist：清單中的世界不會出現 HIM；whitelist：只有清單中的世界會出現。
  mode: blacklist
  list: []
  # 是否允許在地獄 / 終界發生事件（預設只在主世界類型的世界）。
  allow-nether: false
  allow-end: false

# ----------------------------------------------------------------------------
# 玩家參與
# ----------------------------------------------------------------------------
players:
  # 新玩家預設是否成為 HIM 的目標（管理員可用 /him participation 個別調整）。
  participate-by-default: true
  # 擁有 him.exempt 權限的玩家永遠不會成為目標。
  respect-exempt-permission: true
  # 玩家登入後的寬限時間（分鐘），期間不會發生任何事件。
  grace-minutes-after-join: 2
  # 只針對生存 / 冒險模式玩家（創造與旁觀模式不受影響）。
  survival-and-adventure-only: true

# ----------------------------------------------------------------------------
# 恐怖導演（Horror Director）
# 沒有固定時間表：發生機率會隨「安靜了多久」逐漸升高，並受階段、張力節奏、
# HIM 的性格、環境與伺服器效能影響。沉默本身也是 HIM 的選擇。
# ----------------------------------------------------------------------------
director:
  # 整體事件頻率倍率。0 = 完全不主動發生事件，2 = 約兩倍頻繁。
  frequency: 1.0
  # 恐怖強度倍率（影響可選事件的強度上限）。0.5 較溫和，1.5 更激烈。
  intensity: 1.0
  # 每位玩家多久評估一次（秒）。
  evaluation-interval-seconds: 6
  # 同一位玩家兩次事件之間最短的安靜時間（秒）。
  min-gap-seconds: 150
  # 各階段平均安靜時間（分鐘），依序為：未察覺、被注意、被監視、被獵殺、執念。
  mean-gap-minutes: [35, 24, 17, 13, 10]
  # 危險率曲線形狀（1 = 完全隨機；越大越接近「安靜越久越可能發生」）。
  hazard-shape: 2.0
  # 允許達到的最高階段（0-4）。設為 2 代表永遠不會進入追殺階段。
  max-stage: 4
  # 進入各階段所需的遊玩時間（分鐘）與需要的「顯著遭遇」次數。
  stage-play-minutes: [0, 15, 45, 120, 240]
  stage-encounters: [0, 0, 2, 5, 10]
  # HIM 刻意打破玩家已熟悉之規律的最短間隔（分鐘）。
  subversion-min-gap-minutes: 45
  # 所有事件本身冷卻時間的倍率。
  event-cooldown-multiplier: 1.0
  # 全伺服器恐怖預算（權杖桶）：避免人多時事件過度密集。
  global-budget:
    capacity: 4.0
    refill-per-minute: 0.6
  # 停用的事件 ID（用 /him events 查看所有事件）。
  disabled-events: []

# ----------------------------------------------------------------------------
# HIM 的外觀（Paper Mannequin 實體）
# ----------------------------------------------------------------------------
apparitions:
  # 全伺服器同時存在的 HIM 身影上限（包含私人幻覺）。
  max-active: 3
  # 出現位置與玩家的最遠距離。
  max-distance: 96
  skin:
    # 已由 Mojang 簽名的經典白眼皮膚資料（textures 屬性的 value 與 signature）。
    # 可以換成任何由 Mojang 簽名的皮膚（例如從 mineskin.org 取得）。
    texture-value: ""
    texture-signature: ""

# ----------------------------------------------------------------------------
# 追殺
# ----------------------------------------------------------------------------
chase:
  enabled: true
  # 追殺傾向倍率。0 = 永不追殺，1 = 預設，2 = 很好戰。
  aggression: 1.0
  # 全伺服器同時進行的追殺上限。
  max-concurrent: 1
  # 速度（方塊/秒）。玩家行走約 4.3、衝刺約 5.6。
  speed:
    walk: 3.0
    run: 5.0
    burst: 6.6
  # 短暫爆發衝刺的持續與冷卻（tick，20 tick = 1 秒）。
  burst-ticks: 26
  burst-cooldown-ticks: 160
  # 攻擊距離、傷害（1.0 = 半顆心）與攻擊冷卻。
  attack-range: 1.9
  damage: 5.0
  attack-cooldown-ticks: 24
  # false 時 HIM 的攻擊最多讓玩家剩半顆心，不會致死。
  lethal: true
  # 追殺最長持續時間（秒），時間到 HIM 會放棄並離開。
  max-duration-seconds: 100
  # 現身後靜止凝視的時間（tick），給玩家反應時間。
  reveal-ticks: 36
  # 失去視線多久後轉入搜尋（tick）與搜尋多久後放棄（秒）。
  lose-sight-ticks: 70
  search-seconds: 18
  # 距離超過多少格且看不見玩家時判定玩家逃脫。
  escape-distance: 40
  # （combat.killable: false 時）玩家擊中 HIM 幾次後他會被擊退並撤離。
  hits-to-repel: 6
  # 假撤退（轉身消失、再從前方繞出）的傾向（0-1）。
  fake-retreat-chance: 0.35
  # 卡住時，在玩家看不到的情況下允許重新定位的次數（不會無限瞬移）。
  max-hidden-repositions: 2
  # 追殺時是否會打開木門 / 柵欄門（事後自動關上）。
  open-doors: true
  # 被 HIM 殺死時的死亡訊息。{player} 代表玩家名稱。留空則使用原版訊息。
  death-message: "{player} 再也沒有回來。"
  # 鞘翅飛行：他不會飛。玩家飛起來時他隱身並持續掌握位置，玩家一落地他就已經在附近；
  # 短暫滑翔不算。整場追殺累計在空中超過 escape-seconds 秒才算真正逃脫（落地再起飛不會重置）。
  # 經常靠飛行逃脫的玩家，下次的時間會更長。
  flight:
    escape-seconds: 30
    # 飛行途中，可能有一次看到他站在前方的地面上，抬頭看著你。
    watch-from-below: true
  # 傳送（/tp、/home、/spawn、/tpa 等指令或插件傳送）：傳送不是免費的逃脫。
  # 他會在幾秒後出現在你傳送到的地方附近（在你看不到的位置），包括其他世界（需為 HIM 啟用的世界）。
  # 每場追殺最多跟隨 follows 次，再傳送一次就算逃脫。0 = 傳送直接算逃脫。
  # 地獄門、終界門、終界折躍門是正常遊戲行為，視為逃脫，不會跟隨。
  teleport:
    follows: 2
    # true：被追殺時完全無法用指令傳送（擁有 him.bypass-teleport-block 權限者除外）。
    block-commands: false
  # 圍困：被追殺的玩家就在附近卻到不了（墊高、把自己封在洞裡）時，HIM 不會放棄，而是想辦法過去。
  # 真正的室內（有光、有屋頂）仍然安全：他會在外面守候，但不會破門而入。
  # 所有破壞與搭建都寫入回滾日誌，事後在無人時自動還原；會被世界保護插件（實體改變方塊事件）阻止。
  siege:
    # 破壞擋路的方塊、敲掉玩家腳下的方塊。
    break-blocks: true
    # 像玩家一樣墊高自己，爬到墊高的玩家旁邊。
    build-up: true
    # 每場追殺最多破壞／放置的方塊數，用完後他只會在下面守著。
    max-blocks: 12
    # 只破壞硬度不超過此值的方塊（泥土 0.5、石頭 1.5、鐵磚 5、黑曜石 50）。容器與方塊實體永遠不破壞。
    max-hardness: 5.0
    # 墊高時使用的方塊。
    build-material: NETHERRACK
    # 破壞一個方塊所需的時間（tick）。
    ticks-per-block: 20
  # 追殺時 HIM 的裝備（只是外觀時也會照常顯示）。
  equipment:
    # none：赤手空拳（經典 Herobrine）
    # fixed：使用下方 fixed 的設定
    # adaptive：隨玩家的反抗紀錄升級——越常擊退或逃脫他的玩家，遇到的 HIM 裝備越好；
    #           在地下時拿鎬，戶外拿斧或劍；偶爾會「降一級」，讓裝備不完全可預測。
    #           1 鐵斧／石劍 → 2 鐵劍＋鐵胸甲 → 3 鑽石劍＋全套鐵甲 → 4 獄髓劍＋全套獄髓裝（附魔光澤）
    mode: adaptive
    # adaptive 最高可達的等級（0-4）。
    max-tier: 4
    # 第 4 級帶附魔光澤（只是外觀，不是真的附魔）。
    enchant-glint: true
    fixed:
      main-hand: IRON_SWORD
      off-hand: ""
      helmet: ""
      chestplate: ""
      leggings: ""
      boots: ""
      # 遠程武器（BOW 或留空）與是否攜帶喝擲藥水。
      ranged: ""
      potions: false
      # fixed 裝備是否帶附魔光澤。
      enchant-glint: false
    # 武器是否增加傷害（例如鐵劍 +1、鑽石劍 +1.5、獄髓劍 +2）。
    weapon-affects-damage: true
    # 武器增加的傷害上限。
    max-damage-bonus: 2.0
    # 他穿的盔甲是否讓他更耐打：可擊殺時每件減少他受到的傷害（見 combat），否則每件讓擊退所需次數 +1。
    armor-affects-repel: true
    # 計算的盔甲件數上限（保留「反擊」這條逃脫路線）。
    max-repel-bonus: 3
  # 與 HIM 戰鬥。
  combat:
    # true：他有生命值，可以被打倒（打倒時倒地化為煙霧消失）；false：舊規則，被擊中 hits-to-repel 次後撤退。
    killable: true
    # 生命值，依裝備等級 0-4（赤手空拳、石、鐵、鑽石、獄髓）。20 = 玩家的 10 顆心。
    # 傷害就是你實際打出的傷害（武器、附魔、爆擊、弓箭都算），他的盔甲另外再減傷。
    # 參考：獄髓劍每擊約 8，對全套獄髓的他（減傷 24%）約 6，200 血大約要 30 擊左右（含爆擊會少一些）。
    health-by-tier: [40, 60, 90, 130, 200]
    # 他每穿一件盔甲，受到的傷害減少多少（最多算 equipment.max-repel-bonus 件）。
    armor-reduction-per-piece: 0.08
    # 生命低於此比例時，每次被擊中有 flee-chance 的機率撤退（他會記得）。
    flee-below: 0.3
    flee-chance: 0.35
    # 被打倒時掉落他的頭（白眼皮膚的玩家頭顱）的機率。
    head-drop-chance: 0.05
  # 手上武器以外的武器（adaptive 會依玩家的習慣決定誰會遇到哪些：常逃跑的玩家較常遇到弓與緩速藥水，
  # 常反擊的玩家較常遇到斧頭與重錘）。他的箭與藥水只會影響被追殺的玩家，其他人看不到也碰不到。
  weapons:
    # 弓：玩家逃跑、或站在他上不去的地方時，他會停下來拉弓射擊。
    bow: true
    arrow-damage: 4.0
    bow-cooldown-ticks: 60
    # 他的箭有多少機率是藥水箭，以及可能的效果（POISON 中毒、SLOWNESS 緩速、WEAKNESS 虛弱、HARMING 傷害、
    # WITHER 凋零、BLINDNESS 失明、NAUSEA 噁心、HUNGER 飢餓）。chase.lethal: false 時不會使用傷害與凋零。
    tipped-arrow-chance: 0.25
    tipped-effects: [POISON, SLOWNESS, WEAKNESS, HARMING]
    # 喝擲藥水：緩速（對逃跑的人）、虛弱（對反擊的人）、黑暗（在暗處）。
    potions: true
    potion-effects: [SLOWNESS, WEAKNESS, DARKNESS]
    potion-cooldown-ticks: 300
    max-potions: 3
    # 長矛（攻擊距離較遠、衝刺時突刺）。
    spears: true
    # 重錘（從高處落下時重擊；鑽石級以上才會出現）。
    maces: true
  # 戰術（依裝備等級 0-4 開始使用；5 = 不使用）。
  tactics:
    # 副手盾牌：你拉弓／弩／三叉戟瞄他時舉盾，或在你連續打他時舉盾。正面的攻擊與箭會被擋下；用斧頭能打掉他的盾 5 秒。
    shield-min-tier: 2
    # 跳劈暴擊：近戰前先跳起，落下時暴擊（傷害 ×1.4）。
    crit-jump-min-tier: 3
    # 金蘋果：半血以下時邊後退邊吃（每場一次），回復 golden-apple-heal 比例的生命；吃的時候被打中會被打斷。
    golden-apple-min-tier: 3
    golden-apple-heal: 0.25
    # 蜘蛛網：你逃跑時丟在你前方（每場一次）。真實方塊，寫入回滾日誌並在之後還原，遵守世界保護設定。
    cobweb-min-tier: 3
    # 不死圖騰：第一次被打倒時帶著 totem-restore 比例的生命站起來（每場一次）。
    totem-min-tier: 4
    totem-restore: 0.3
  # 水中與雨中：你跳進水裡、坐船或站在雨中時，他改拿三叉戟。
  # 他游得比較快（swim-speed × 奔跑速度，預設 0.9 × 5.0 = 4.5 格／秒），但仍略慢於玩家衝刺游泳，海仍是一條逃生路。
  # 三叉戟只會影響被追殺的玩家，其他人看不到、碰不到，也撿不起來。
  water:
    enabled: true
    # 從這個裝備等級開始（0 = 連赤手空拳的他也會）。
    min-tier: 1
    swim-speed: 0.9
    trident-damage: 6.0
    trident-cooldown-ticks: 50
    # 精良級：在水中或雨中用「激流」朝你衝過來。
    riptide: true
    # 獄髓級、雷雨中：每場一次「喚雷」，閃電落在你身上。
    channeling: true
    channeling-damage: 4.0
    # 他的攻擊與三叉戟會打壞你坐的船（船會掉落，不會消失）。
    sink-boats: true
  # 精良裝備（鑽石＝3、獄髓＝4）的他：像熟練的 PvP 玩家一樣戰鬥，但仍然可以被打倒。
  elite:
    # 從這個等級開始：左右走位、打一下退一步、保持長矛距離、看到你拉弓會閃開。
    min-tier: 3
    # 拿重錘時用風彈跳起，落在你身上重擊。
    wind-charge-leap: true
    # 你一直逃跑時，喝一瓶速度藥水（每場一次）。
    speed-potion: true
    # 速度藥水的加成。預設 1.1（奔跑 5.0 → 5.5），仍略低於玩家衝刺速度，衝刺逃跑仍然可行。
    speed-boost: 1.1
    # 召喚怪物協同作戰：達到 min-tier、生命低於 below-health 時召喚一次。
    # 這些是真實的怪物：只會攻擊被追殺的玩家、不掉落物品與經驗，追殺結束時化為煙霧消失。
    minions:
      enabled: true
      min-tier: 4
      below-health: 0.5
      count: 3
      types: [ZOMBIE, SKELETON]
    # 從這個等級開始，被追殺的人會看到他的 BOSS 血條（0 = 永不顯示）。
    boss-bar-min-tier: 4
    # 終界珍珠：路走不到時（峽谷、懸崖、水道、高台），丟珍珠到你附近。看得到它飛過來。
    # 平地追逐時不會用（衝刺逃跑仍然有效），不會丟進真正的室內，也不會丟得比 max-distance 遠。
    # 落地時他和玩家一樣會受傷（self-damage，從他的生命值扣）。
    ender-pearl:
      enabled: true
      max-per-hunt: 2
      cooldown-ticks: 200
      max-distance: 30
      self-damage: 5

# ----------------------------------------------------------------------------
# 世界干擾
# 假方塊只送給目標玩家的客戶端，不會改變真實世界。
# 真實修改一律記錄於回滾日誌，會在無人觀看時自動還原，伺服器重啟後也會繼續還原。
# ----------------------------------------------------------------------------
world-modification:
  # 總開關：false 時所有方塊相關事件（包含假方塊）都停用。
  enabled: true
  # 允許只有玩家看得到的假方塊（熄滅的火把、裂痕、神龕、告示牌）。
  fake-blocks: true
  # 允許真實修改（無葉的樹、礦洞中的通道）。只會修改天然方塊。
  real-changes: true
  # 遵守 mobGriefing 遊戲規則（關閉時不做真實修改）。
  respect-mob-griefing: true
  # 真實修改在多少分鐘後還原（還原只在附近沒有玩家時進行）。
  revert-after-minutes: 20
  # 真實修改不會發生在玩家基地估計位置、床、世界出生點的此半徑內。
  protect-radius: 48
  # 某區塊被玩家放置超過此數量的方塊就視為建築區，不做真實修改。
  protect-built-threshold: 6
  # 允許 HIM 打開玩家基地的門（只開門，不破壞）。
  door-interaction: true

# ----------------------------------------------------------------------------
# 多人
# ----------------------------------------------------------------------------
multiplayer:
  # 判定「玩家在一起」的半徑。
  group-radius: 32
  # 群體 / 共享遭遇最多參與人數。
  max-participants: 4
  # 允許只讓單一玩家看到的假聊天訊息（例如假的加入訊息）。
  fake-chat: true

# ----------------------------------------------------------------------------
# 偽裝
# HIM 以另一位線上玩家（通常是你常一起玩的朋友）的外觀，只出現在你眼前。
# 擁有 him.no-impersonate 權限、或不參與 HIM 的玩家永遠不會被偽裝。
# ----------------------------------------------------------------------------
impersonation:
  enabled: true
  # 頭上顯示朋友的名字（更像真的玩家）。
  show-name: true
  # 真正的那位朋友至少要離你這麼遠（或在其他世界），偽裝才會發生。
  min-distance-from-real: 48

# ----------------------------------------------------------------------------
# 告示牌對話：玩家在告示牌上寫給他的話，他會在一段時間後回覆。
# 回覆只有寫字的人看得到（其他玩家看到的仍是原本的字），並會在之後幾天內一直留在那塊告示牌上。
# 他可能回答（用他記得的事）、拒絕、抹掉你的字，或因此改變態度：
#   挑釁 → 他更執著，接下來會更快出現；
#   請求他離開 → 有時給你一段平靜，有時答應了卻不遵守，求太多次他會記得。
# 支援中文與英文，以你寫的語言回答。
# ----------------------------------------------------------------------------
signs:
  enabled: true
  # 低於此階段的玩家不會得到回覆（0 = 一開始就會）。
  min-stage: 1
  # 寫下後多久回覆（分鐘，隨機）。回覆會在你回到告示牌附近、沒有看著它時出現。
  reply-delay-minutes:
    min: 2
    max: 12
  # 不是寫給他的告示牌（例如「倉庫」），他偶爾也會回應的機率。
  unaddressed-chance: 0.2
  # 他答應離開時給的平靜時間（分鐘）。
  quiet-minutes:
    min: 20
    max: 60
  # 回覆在寫字的人眼中保留幾天。
  visible-days: 3

# ----------------------------------------------------------------------------
# 記憶與資料保存（plugins/HIM/data/）
# ----------------------------------------------------------------------------
memory:
  # 自動存檔間隔（分鐘）。
  autosave-minutes: 5
  # 多少天沒上線的玩家資料會被遺忘（0 = 永不刪除）。
  forget-after-days: 180
  # 活動熱點的半衰期（天）：越短 HIM 越快「忘記」舊的活動區域。
  heat-half-life-days: 10
  # 每位玩家最多記住的熱點區塊數。
  heat-capacity: 96
  # 性格每天回歸基準值的比例（0 = 永久累積變化）。
  personality-relax-per-day: 0.03

# ----------------------------------------------------------------------------
# 效能保護
# 伺服器變慢時，HIM 會自動降低事件密度、停止新的追殺，嚴重時暫停所有事件。
# ----------------------------------------------------------------------------
performance:
  # 平均 MSPT 超過此值視為吃緊（降低頻率、不開始新追殺）。
  mspt-strained: 40
  # 平均 MSPT 超過此值或 TPS 低於 tps-critical 視為危急（結束所有事件）。
  mspt-critical: 48
  tps-critical: 17
  # 插件自身每 tick 的平均時間預算（毫秒），超過時降低 AI 更新頻率。
  own-budget-ms: 2.0

# ----------------------------------------------------------------------------
# 玩家看得到的文字
# 告示牌文字以 | 分隔四行，可用變數：{player} 玩家名稱、{days} 被 HIM 認識的天數、
# {x} {z} 上次遭遇的座標。
# ----------------------------------------------------------------------------
messages:
  # 假加入訊息顯示的名稱（只有目標玩家看得到）。
  fake-join-name: Herobrine
  sign-texts:
    - "||我看見你了|"
    - "|{player}||"
    - "|不要回頭||"
    - "我一直都在|||"
    - "|你記得|{x} {z}|嗎"
    - "|{days} 天了||"
    - "||這裡不是|你的家"
    - "|你為什麼|要跑|"
  # 回到特殊地點時告示牌上的文字（留空 = 不放告示牌）。
  landmark-texts:
    escape-site: "|你逃走了||這次。"
    death-site: "||又見面了|"
    attack-site: "|會痛嗎||"
    logout-site: "|你離開了|我在等|"
